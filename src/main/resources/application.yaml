spring:
  config:
    import: optional:file:./.env[.properties]

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}

  application:
    name: meeting-insights

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/meeting_insights}}
    # Padrão igual ao compose.yaml (postgres/postgres). Troque no .env se o seu banco for diferente.
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  ai:
    openai:
      max-retries: 0
      timeout: 180s
      chat:
        max-retries: 0
        timeout: 180s
      embedding:
        max-retries: 0
        timeout: 30s
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 100

app:
  jwt:
    # Obrigatório: no mínimo 32 caracteres. Defina JWT_SECRET no .env.
    secret: ${JWT_SECRET}
    expiration-hours: 8
  admin:
    # Cadastro é fechado: este usuário vira o primeiro administrador ao iniciar.
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
    nome: ${ADMIN_NOME:Administrador}

server:
  port: "${PORT:8080}"

logging:
  file:
    name: logs/meeting-insights.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
