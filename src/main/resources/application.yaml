spring:
  application:
    name: meeting-insights

  datasource:
    url: jdbc:postgresql://localhost:5432/meeting_insights
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true